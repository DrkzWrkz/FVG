services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-autonomous_label}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/autonomous_label}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --app-dir services/orchestrator/app
    depends_on:
      - postgres
      - qdrant
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api:8000}
    command: npm run dev --workspace @record-label/web -- --hostname 0.0.0.0 --port 3000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  qdrant_data:
